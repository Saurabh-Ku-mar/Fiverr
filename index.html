<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SecureChat</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0f2f5;--pn:#fff;--tx:#111b21;--mu:#667781;--ac:#00a884;--me:#d9fdd3;--th:#fff;--bd:#e2e6e9}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--pn:#111b21;--tx:#e9edef;--mu:#8696a0;--ac:#00a884;--me:#005c4b;--th:#202c33;--bd:#222d34}}
:root[data-theme="dark"]{--bg:#0b141a;--pn:#111b21;--tx:#e9edef;--mu:#8696a0;--ac:#00a884;--me:#005c4b;--th:#202c33;--bd:#222d34}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px}
button.g{background:transparent;color:var(--tx);padding:6px 9px}button.d{background:#d93025}
input,textarea{width:100%;background:var(--th);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:5px 0}
.hide{display:none!important}
#lock{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--pn);padding:26px;border-radius:14px;width:100%;max-width:360px;text-align:center;box-shadow:0 2px 14px #0003}
.card h2{margin:0 0 6px}.mu{color:var(--mu);font-size:13px}.err{color:#d93025;font-size:13px;min-height:18px}
#app{height:100%;display:flex}
#side{width:340px;max-width:100%;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--th)}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.sp{flex:1;min-width:0}.sp b,.sp small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list{flex:1;overflow:auto}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer}
.row:hover,.row.on{background:var(--th)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:5px}
.m{max-width:75%;padding:7px 10px;border-radius:9px;background:var(--th);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.m.me{background:var(--me);align-self:flex-end}.m small{display:block;color:var(--mu);font-size:11px;text-align:right}
#send{display:flex;gap:8px;padding:10px;background:var(--th);align-items:center}#send input{margin:0}
.menu{position:absolute;right:10px;top:56px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:5;min-width:170px;box-shadow:0 4px 16px #0004}
.menu button{display:block;width:100%;text-align:left;background:none;color:var(--tx)}.menu button:hover{background:var(--th)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{text-align:left;max-height:90%;overflow:auto}
.empty{margin:auto;color:var(--mu);text-align:center}
@media(max-width:700px){#side{width:100%}#app.chat #side{display:none}#app:not(.chat) #main{display:none}}
</style></head><body>
<div id="lock"><div class="card"><h2>🔒 SecureChat</h2>
<p class="mu" id="lt">Enter your password to open.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="off">
<input id="pw2" type="password" placeholder="Confirm password" class="hide">
<div class="err" id="le"></div><button id="lb" style="width:100%">Unlock</button>
<p class="mu">Everything is encrypted with a key made from your password. Forgotten passwords cannot be recovered.</p></div></div>
<div id="app" class="hide">
<div id="side"><div class="bar"><div class="av" id="myav"></div><div class="sp"><b id="myn"></b><small class="mu" id="mya"></small></div>
<button class="g" id="bnew" title="Invite / Join">➕</button><button class="g" id="bset" title="Settings">⚙️</button></div>
<div style="padding:8px 12px"><input id="q" placeholder="Search chats" style="margin:0"></div><div id="list"></div></div>
<div id="main"><div class="empty" id="emp">Select a chat or tap ➕ to invite someone.<br>🔐 Messages are end-to-end encrypted.</div>
<div id="chat" class="hide" style="display:flex;flex-direction:column;height:100%;position:relative">
<div class="bar"><button class="g" id="back">←</button><div class="av" id="cav"></div><div class="sp"><b id="cn"></b><small class="mu" id="cs"></small></div><button class="g" id="bmenu">⋮</button></div>
<div id="msgs"></div><div id="send"><input id="mi" placeholder="Type a message" autocomplete="off"><button id="bs">Send</button></div></div></div></div>
<div id="mod" class="modal hide"><div class="card" id="mc"></div></div>
<script>
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
const ub=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,vk=null,vs=null,db=null,me=null,cur=null,subs=[],P={},meta={},ck={},idle=null,msgUn=null;
const V='sc_vault',rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function pk(pw,salt){const b=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function save(){const iv=rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},vk,enc.encode(JSON.stringify(S)));
try{localStorage.setItem(V,JSON.stringify({s:b64(vs),i:b64(iv),c:b64(ct)}))}catch(e){}}
async function unlock(){const pw=$('pw').value,er=$('le');er.textContent='';let raw=null;
try{raw=JSON.parse(localStorage.getItem(V))}catch(e){}
if(!raw){if(pw.length<8)return er.textContent='Use at least 8 characters.';if(pw!==$('pw2').value)return er.textContent='Passwords do not match.';
vs=rnd(16);vk=await pk(pw,vs);S={chats:{},prefs:{lock:5},prof:{name:'Me',about:'Hey there! I use SecureChat.',color:'#00a884'}};await save()}
else{try{vs=ub(raw.s);vk=await pk(pw,vs);S=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(raw.i)},vk,ub(raw.c))))}
catch(e){return er.textContent='Wrong password.'}}
$('pw').value=$('pw2').value='';$('lock').classList.add('hide');$('app').classList.remove('hide');start()}
function lockNow(){subs.forEach(u=>u());subs=[];if(msgUn)msgUn();msgUn=null;S=vk=null;ck={};cur=null;
$('app').classList.add('hide');$('mod').classList.add('hide');$('lock').classList.remove('hide');init()}
function init(){const has=!!localStorage.getItem(V);$('pw2').classList.toggle('hide',has);$('lb').textContent=has?'Unlock':'Create password';
$('lt').textContent=has?'Enter your password to open.':'Create a password. It protects this app on this device.'}
$('lb').onclick=unlock;$('pw').onkeydown=$('pw2').onkeydown=e=>{if(e.key==='Enter')unlock()};
function bump(){clearTimeout(idle);if(S&&S.prefs.lock>0)idle=setTimeout(lockNow,S.prefs.lock*60000)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,bump));
async function start(){bump();try{const u=await claude.use('user');me=u&&await u.id();db=await claude.use('db')}catch(e){}
await syncProfile();Object.keys(S.chats).forEach(watch);render()}
async function syncProfile(){const p=S.prof;$('myn').textContent=p.name;$('mya').textContent=p.about;av($('myav'),p.name,p.color);
if(db&&me)try{await db.doc('profiles/'+me).set({name:p.name,about:p.about,color:p.color})}catch(e){}}
function av(el,n,c){el.style.background=c||'#667781';el.textContent=(n||'?')[0].toUpperCase()}
function watch(id){if(!db)return;subs.push(db.doc('chats/'+id).onSnapshot(async s=>{if(!s.exists)return;const m=s.data();meta[id]=m;
const c=S.chats[id];const peer=(m.members||[]).find(x=>x!==me);if(c&&peer&&c.peer!==peer){c.peer=peer;save()}
if(peer&&!P[peer])try{const d=await db.doc('profiles/'+peer).get();if(d.exists)P[peer]=d.data()}catch(e){}render()}))}
const cname=c=>c.nick||(P[c.peer]&&P[c.peer].name)||(c.peer?'Contact':'Waiting for contact…');
function render(){if(!S)return;const q=$('q').value.toLowerCase();const ids=Object.keys(S.chats).filter(i=>cname(S.chats[i]).toLowerCase().includes(q))
.sort((a,b)=>(S.chats[b].pin?1:0)-(S.chats[a].pin?1:0)||S.chats[b].t-S.chats[a].t);
$('list').innerHTML=ids.length?'':'<p class="empty mu" style="padding:20px">No chats yet. Tap ➕ to invite.</p>';
ids.forEach(i=>{const c=S.chats[i],n=cname(c),r=document.createElement('div');r.className='row'+(i===cur?' on':'');
r.innerHTML='<div class="av"></div><div class="sp"><b>'+esc(n)+(c.pin?' 📌':'')+(c.blocked?' 🚫':'')+'</b><small class="mu">'+esc(c.peer?((P[c.peer]||{}).about||''):'Share your invite code')+'</small></div>';
av(r.firstChild,n,(P[c.peer]||{}).color);r.onclick=()=>open(i);$('list').appendChild(r)});
if(cur&&S.chats[cur]){const c=S.chats[cur];$('cn').textContent=cname(c);$('cs').textContent=c.blocked?'Blocked':'🔐 end-to-end encrypted';av($('cav'),cname(c),(P[c.peer]||{}).color)}}
$('q').oninput=render;
async function key(id){if(!ck[id])ck[id]=await crypto.subtle.importKey('raw',ub(S.chats[id].k),'AES-GCM',false,['encrypt','decrypt']);return ck[id]}
async function open(id){cur=id;$('app').classList.add('chat');$('emp').classList.add('hide');$('chat').classList.remove('hide');$('menu')&&$('menu').remove();render();
if(msgUn)msgUn();if(!db)return;const k=await key(id);
msgUn=db.collection('chats/'+id+'/messages').orderBy('ts').onSnapshot(async snap=>{if(cur!==id)return;const c=S.chats[id];const out=[];
for(const d of snap.docs){const m=d.data();if(m.ts<=(c.cleared||0)||(c.blocked&&m.from!==me))continue;
try{const t=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(m.iv),additionalData:enc.encode(id+m.from)},k,ub(m.ct)));out.push([m,t])}
catch(e){out.push([m,'⚠️ Could not decrypt'])}}
const box=$('msgs'),end=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.innerHTML='';
out.forEach(([m,t])=>{const e=document.createElement('div');e.className='m'+(m.from===me?' me':'');
e.innerHTML=esc(t)+'<small>'+new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</small>';box.appendChild(e)});
if(end||!box.dataset.s){box.scrollTop=box.scrollHeight;box.dataset.s=1}if(out.length){c.t=out[out.length-1][0].ts;render()}})}
async function sendMsg(){const t=$('mi').value.trim();if(!t||!cur||!db||!me)return;const c=S.chats[cur];if(c.blocked)return toast('Unblock this contact to send messages.');
$('mi').value='';const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(cur+me)},await key(cur),enc.encode(t));
try{await db.collection('chats/'+cur+'/messages').doc(b64(rnd(9))).set({from:me,iv:b64(iv),ct:b64(ct),ts:Date.now()})}catch(e){toast('Send failed.')}}
$('bs').onclick=sendMsg;$('mi').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
$('back').onclick=()=>{$('app').classList.remove('chat')};
function modal(h){$('mc').innerHTML=h;$('mod').classList.remove('hide')}function closeM(){$('mod').classList.add('hide')}
$('mod').onclick=e=>{if(e.target===$('mod'))closeM()};
function toast(t){modal('<p>'+esc(t)+'</p><button onclick="closeM()">OK</button>')}
$('bnew').onclick=()=>modal('<h3>Invite or join</h3><button id="mk" style="width:100%">Create invite code</button><p class="mu">Or paste a code you received:</p><input id="jc" placeholder="Invite code"><button id="jn">Join chat</button><div class="err" id="je"></div>');
document.addEventListener('click',async e=>{
if(e.target.id==='mk'){if(!db||!me)return toast('Open this page in claude.ai while signed in to chat.');const id=b64(rnd(9)),k=b64(rnd(32));
try{await db.doc('chats/'+id).set({members:[me],created:Date.now()})}catch(x){return toast('Could not create chat.')}
S.chats[id]={k,t:Date.now()};await save();watch(id);render();const code=id+'.'+k;
modal('<h3>Invite code</h3><p class="mu">Send this code to your contact through a secure channel. Anyone with it can read this chat.</p><input readonly value="'+code+'" onclick="this.select()"><button onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+code+'\');this.textContent=\'Copied\'">Copy</button> <button class="g" onclick="closeM()">Done</button>')}
if(e.target.id==='jn'){const [id,k]=$('jc').value.trim().split('.');const er=$('je');if(!id||!k||!db||!me)return er.textContent='Invalid code, or not signed in.';
try{const d=await db.doc('chats/'+id).get();if(!d.exists)return er.textContent='Chat not found.';const m=d.data().members||[];
if(!m.includes(me)){if(m.length>=2)return er.textContent='This chat already has two members.';await db.doc('chats/'+id).update({members:[...m,me]})}
ub(k);S.chats[id]={k,t:Date.now(),peer:m.find(x=>x!==me)};await save();watch(id);closeM();render();open(id)}catch(x){er.textContent='Could not join.'}}
if(e.target.id!=='bmenu'&&$('menu')&&!e.target.closest('#menu'))$('menu').remove()});
$('bmenu').onclick=()=>{if($('menu'))return $('menu').remove();const c=S.chats[cur],m=document.createElement('div');m.className='menu';m.id='menu';
m.innerHTML='<button data-a="pin">'+(c.pin?'Unpin chat':'Pin chat')+'</button><button data-a="nick">Edit contact name</button><button data-a="blk">'+(c.blocked?'Unblock':'Block')+'</button><button data-a="clr">Clear chat</button><button data-a="del">Delete chat &amp; contact</button>';
m.onclick=async e=>{const a=e.target.dataset.a;m.remove();if(!a)return;
if(a==='pin')c.pin=!c.pin;if(a==='blk')c.blocked=!c.blocked;if(a==='clr'){c.cleared=Date.now();$('msgs').innerHTML=''}
if(a==='nick'){modal('<h3>Contact name</h3><input id="nn" value="'+esc(c.nick||'')+'" placeholder="'+esc(cname(c))+'"><button id="nok">Save</button>');
$('nok').onclick=async()=>{c.nick=$('nn').value.trim();await save();closeM();render()};return}
if(a==='del'){modal('<h3>Delete chat?</h3><p class="mu">Removes this chat and its key from this device. You will need the invite code to rejoin.</p><button class="d" id="dok">Delete</button> <button class="g" onclick="closeM()">Cancel</button>');
$('dok').onclick=async()=>{delete S.chats[cur];if(msgUn)msgUn();msgUn=null;cur=null;await save();closeM();$('chat').classList.add('hide');$('emp').classList.remove('hide');$('app').classList.remove('chat');render()};return}
await save();render()};$('chat').appendChild(m)};
$('bset').onclick=()=>{const p=S.prof;modal('<h3>Settings</h3><label class="mu">Profile name</label><input id="sn" value="'+esc(p.name)+'" maxlength="40"><label class="mu">About</label><input id="sa" value="'+esc(p.about)+'" maxlength="80">'+
'<label class="mu">Colour</label><input id="sc" type="color" value="'+p.color+'" style="height:40px"><label class="mu">Auto-lock after (minutes, 0 = never)</label><input id="sl" type="number" min="0" value="'+S.prefs.lock+'">'+
'<button id="ss" style="width:100%">Save profile &amp; settings</button><hr><button class="g" id="sp">Change password</button> <button class="g" id="sk">Lock now</button> <button class="g" id="sw" style="color:#d93025">Erase all data</button>')};
document.addEventListener('click',async e=>{const i=e.target.id;
if(i==='ss'){S.prof={name:$('sn').value.trim()||'Me',about:$('sa').value.trim(),color:$('sc').value};S.prefs.lock=Math.max(0,+$('sl').value||0);await save();await syncProfile();bump();closeM()}
if(i==='sk'){closeM();lockNow()}
if(i==='sp')modal('<h3>Change password</h3><input id="np" type="password" placeholder="New password (8+ chars)"><button id="npk">Change</button>'),$('npk').onclick=async()=>{const v=$('np').value;if(v.length<8)return;vs=rnd(16);vk=await pk(v,vs);await save();closeM()};
if(i==='sw')modal('<h3>Erase everything?</h3><p class="mu">Deletes all chats, keys and settings from this device.</p><button class="d" id="swk">Erase</button>'),$('swk').onclick=()=>{localStorage.removeItem(V);closeM();lockNow()}});
document.addEventListener('visibilitychange',()=>{});
init();
</script></body></html>
